<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hero_linfeng — 林峰 3D 模型预览</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { background: #f4f5f7; color: #1f2329; display: flex; flex-direction: column; }
    header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e6eb; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .tag { font-size: 12px; color: #86909c; background: #f2f3f5; padding: 3px 10px; border-radius: 12px; }
    main { flex: 1; position: relative; }
    model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8eaed 100%); --poster-color: transparent; }
    .hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.85); border: 1px solid #e5e6eb; border-radius: 20px; padding: 8px 18px; font-size: 13px; color: #4e5969; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>hero_linfeng — 洞三 · 林峰（玩家主角）</h1>
    <span class="tag">写实 PBR · A-Pose 空手 · GPNVG-18 四目夜视仪</span>
  </header>
  <main>
    <model-viewer
      src="hero_linfeng.glb"
      alt="林峰 3D 模型"
      camera-controls
      auto-rotate
      rotate-delay="1500"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      ar
    ></model-viewer>
    <div class="hint">左键拖动旋转 · 滚轮缩放 · 右键平移</div>
  </main>
</body>
</html>
